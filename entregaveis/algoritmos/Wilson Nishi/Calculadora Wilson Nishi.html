<!DOCTYPE html>
<html lang="ptBR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Sensores - GLP</title>
</head>
<body>
    <h1>Calculadora de Dimencionamento de Sensores GLP </h1>

    <h2>Descubra uma quantidade estimada de sensores para sua cozinha</h2>
    <br>
    <span>Digite o tamanho da cozinha em <b>m²</b>: </span>
    <input type="text" id="ipt_area">
    <br><br>
    <span>Digite a quantidade de equipamentos que utilizam GLP: </span>
    <input type="text" id="ipt_equipamentos">
    <br><br>
    <button onclick="Calcular()">Calcular</button>
    <br>
    <br>
    <div id="div_mensagem"></div>
</body>
</html>
<script>
    function Calcular(){
        let area = Number(ipt_area.value)
        let equipamentos = Number(ipt_equipamentos.value)
        let sensores = 0

        if (area <= 30){
            sensores=1
        div_mensagem.innerHTML = `Cozinha <b>Pequena</b>`
        }else if(area <= 60){
            sensores=2
        div_mensagem.innerHTML = `Cozinha <b>Pequena</b>`
        }else if(area <= 90){
            sensores=3
        div_mensagem.innerHTML = `Cozinha <b>Média</b>`
        }else if (area <= 120){
            sensores=4
        div_mensagem.innerHTML = `Cozinha <b>Média</b>`
        }else if (area <= 180){
            sensores=5
        div_mensagem.innerHTML = `Cozinha <b>Grande</b>`
        }else{
            sensores=6
        div_mensagem.innerHTML = `Cozinha <b>Grande</b>`
        }
         if (equipamentos < 10) {
            sensores = sensores + 1;
        }else if (equipamentos >= 10) {
            sensores = sensores + 2;
        }
            div_mensagem.innerHTML += `<h3>Resultado</h3>
            Área da cozinha: ${area} m²<br>
            Equipamentos que utilizam GLP: ${equipamentos}
            <br><br>
            <b>Quantidade estimada de sensores: ${sensores}</b>
            <br>
            A quantidade apresentada é uma estimativa inicial
            <br>
            para o projeto de monitoramento de GLP.`
    }
    
</script>
